[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-sentinel-connector"
version = "1.0.0"
description = "Cliente HTTP de solo API para el plano de control de Ruvic Sentinel"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ruvic_sentinel_connector*"]
